[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "marketplace-policies-code"
version = "0.1.0"
description = "Notebook-first reproduction code for ads marketplace reserve/floor-policy decision support."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Prashant Shekhar" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]
keywords = [
  "decision-support-systems",
  "off-policy-evaluation",
  "real-time-bidding",
  "marketplace-experimentation",
  "causal-inference",
]
dependencies = [
  "graphviz>=0.20.3",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
notebooks = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
]

[project.scripts]
marketplace-policies = "cli:main"

[tool.hatch.build.targets.wheel]
only-include = [
  "src/auction_replay.py",
  "src/checks.py",
  "src/cli.py",
  "src/config.py",
  "src/data_access.py",
  "src/decision_engine.py",
  "src/external_validation.py",
  "src/figures.py",
  "src/guardrails.py",
  "src/nuisance_models.py",
  "src/ope.py",
  "src/panel_builder.py",
  "src/paper_tables.py",
  "src/policy_catalog.py",
  "src/progress.py",
  "src/theory_sensitivity.py",
]
sources = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

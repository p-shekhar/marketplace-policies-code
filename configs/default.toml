[paths]
# Source root should contain generated metadata/, tables/, and data/processed/.
source_root = "artifacts/workspace"
output_root = "artifacts"

[raw_data]
# Put the original iPinYou archive at data/ipinyou/archive.zip.
data_root = "data"
full_run = false
# Notebook-faithful modeling defaults used by the raw-data pipeline:
# - LightGBM nuisance prototype sample: 250,000 rows
# - OPE sample: 100,000 rows per season-two day
# - HistGradientBoosting OPE train/eval caps: 250,000 / 300,000 rows
# - Cross-fitted DR cap: 240,000 rows with 300 cluster bootstraps

[reproduction]
render_figures = true
export_tables = true
validate_claims = true
make_bundle = true

[paper]
priority_policy_id = "hybrid_q75_if_gap_100"
priority_policy_label = "Q75 Margin-Gated Floor"
